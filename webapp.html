<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Skier Game</title>
  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background-color: #e0f7ff;
      overflow: hidden;
    }
    #game {
      width: 800px;
      height: 300px;
      background: linear-gradient(#cceeff, #88dd88);
      margin: 50px auto;
      position: relative;
      overflow: hidden;
      border: 2px solid #333;
    }
    #player {
      width: 50px;
      height: 50px;
      background-image: url('assets/img/cartoonSkier.jpg'); /* <-- update this path if needed */
      background-size: cover;
      position: absolute;
      bottom: 0;
      left: 50px;
      transition: bottom 0.2s;
    }
    #obstacle {
      width: 50px;
      height: 50px;
      background: black;
      position: absolute;
      bottom: 0;
      right: 0;
    }
    #score, #choices {
      text-align: center;
      margin-top: 10px;
    }
    #game-over {
      position: absolute;
      width: 100%;
      text-align: center;
      top: 100px;
      font-size: 24px;
      display: none;
    }
    #restart-btn {
      margin-top: 10px;
      padding: 5px 10px;
      font-size: 18px;
    }
  </style>
</head>
<body>
  <div id="game">
    <div id="player"></div>
    <div id="obstacle"></div>
    <div id="game-over">
      Game Over!<br />
      <button id="restart-btn">Restart</button>
    </div>
  </div>
  <div id="score">Score: 0</div>
  <div id="choices">
    PRESS SPACEBAR TO START <span id="computer-choice">-</span>
    
  </div>

  <script>
    const player = document.getElementById("player");
    const obstacle = document.getElementById("obstacle");
    const gameOver = document.getElementById("game-over");
    const restartBtn = document.getElementById("restart-btn");
    const scoreDisplay = document.getElementById("score");
    const computerChoiceDisplay = document.getElementById("computer-choice");
    const playerChoice = document.getElementById("player-choice");

    let jumping = false;
    let running = false;
    let gameInterval;
    let speedInterval;
    let score = 0;
    let obstacleLeft = 800;
    let gameSpeed = 5;

    function jump() {
      if (jumping) return;
      jumping = true;
      player.style.bottom = "100px";
      setTimeout(() => {
        player.style.bottom = "0";
        jumping = false;
      }, 500);
    }

    function randomComputerChoice() {
      const options = ["jump", "duck"];
      const choice = options[Math.floor(Math.random() * options.length)];
      computerChoiceDisplay.textContent = choice;
    }

    function startGame() {
      if (running) return;
      running = true;
      score = 0;
      obstacleLeft = 800;
      gameSpeed = 5;
      obstacle.style.right = "0px";
      gameOver.style.display = "none";
      randomComputerChoice();

      gameInterval = setInterval(gameLoop, 30);
      speedInterval = setInterval(() => {
        gameSpeed += 1;
        console.log("Speed increased to", gameSpeed);
      }, 30000); // Every 30 seconds
    }

    function gameLoop() {
      obstacleLeft += gameSpeed;
      obstacle.style.right = `${obstacleLeft}px`;

      // Loop obstacle back
      if (obstacleLeft > 850) {
        obstacleLeft = 0;
        score++;
        randomComputerChoice();
      }

      // Check collision
      const playerBottom = parseInt(window.getComputedStyle(player).bottom);
      if (obstacleLeft > 700 && obstacleLeft < 750 && playerBottom < 50) {
        endGame();
      }

      scoreDisplay.textContent = `Score: ${score}`;
    }

    function endGame() {
      clearInterval(gameInterval);
      clearInterval(speedInterval);
      running = false;
      gameOver.style.display = "block";
    }

    function restartGame() {
      score = 0;
      obstacleLeft = 800;
      scoreDisplay.textContent = "Score: 0";
      gameOver.style.display = "none";
      startGame();
    }

    document.addEventListener("keydown", (e) => {
      if (e.code === "Space") {
        if (!running) {
          startGame();
        } else {
          jump();
        }
      }
    });

    restartBtn.addEventListener("click", restartGame);
  </script>
</body>
</html>
